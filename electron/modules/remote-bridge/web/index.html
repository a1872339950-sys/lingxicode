<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050a13">
  <title>灵犀遥控</title>
  <link rel="stylesheet" href="mobile-tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-chat.css">
  <link rel="stylesheet" href="mobile-input.css">
</head>
<body>
  <div id="app">
    <div id="connection-bar" class="connection-bar hidden">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">未连接</span>
      <button id="btn-reconnect" class="btn-link" type="button">重连</button>
    </div>

    <!-- 配对页 -->
    <div id="view-pairing" class="view active">
      <div class="pairing-container">
        <div class="logo">
          <div class="logo-mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3 4.5 7.5v9L12 21l7.5-4.5v-9L12 3Z"/>
              <path d="M12 12 4.5 7.5"/>
              <path d="M12 12v9"/>
              <path d="m12 12 7.5-4.5"/>
            </svg>
          </div>
          <h1>灵犀遥控</h1>
          <p class="subtitle">连接桌面端，继续当前项目对话</p>
        </div>
        <div class="pairing-form">
          <label class="field-label" for="input-pin">配对码</label>
          <input type="text" id="input-pin" placeholder="输入 6 位配对码" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
          <label class="field-label" for="input-device-name">设备名称</label>
          <input type="text" id="input-device-name" placeholder="例如：我的手机" value="">
          <button id="btn-pair" class="btn-primary" type="button" disabled>配对并连接</button>
          <p id="pairing-error" class="error-text hidden"></p>
          <p class="pairing-hint">请在桌面端「远程遥控」面板生成配对码</p>
        </div>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="view-main" class="view">
      <!-- 手机工作台首页 -->
      <section id="page-home" class="page active">
        <div class="home-scroll">
          <header class="home-header">
            <div class="home-brand">
              <div class="home-brand-title">灵犀<span class="brand-spark" aria-hidden="true"></span></div>
              <p>AI 编程工作空间</p>
            </div>
            <button id="btn-open-settings" class="home-device-button" type="button" aria-label="打开连接与设置">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V9a6 6 0 0 1 12 0v10"/><path d="M4 19h16"/><path d="M9 22h6"/></svg>
              <span class="home-device-dot" aria-hidden="true"></span>
              <span id="device-avatar" class="sr-only">灵</span>
            </button>
          </header>

          <div id="home-search-bar" class="home-search-bar">
            <label class="home-search-field" for="input-task-search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="input-task-search" type="search" placeholder="搜索项目、文件或问题..." enterkeyhint="search">
              <button id="btn-home-search" class="search-shortcut" type="button" aria-label="聚焦搜索">⌘K</button>
            </label>
            <button id="btn-new-chat" class="home-new-button" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
              <span>新建</span>
            </button>
          </div>

          <section class="dashboard-section current-task-section">
            <div class="dashboard-section-head">
              <h2>当前任务</h2>
              <button id="btn-home-filter" class="section-link" type="button"><span id="home-title">查看全部</span><span aria-hidden="true">›</span></button>
            </div>
            <div id="task-list" class="current-task-card">
              <div class="loading">加载中...</div>
            </div>
          </section>

          <div class="dashboard-grid">
            <section class="dashboard-card compact-card" id="active-projects-card">
              <div class="dashboard-card-head">
                <h2>活跃项目</h2>
                <button id="btn-view-all-projects" class="section-link" type="button">查看全部<span aria-hidden="true">›</span></button>
              </div>
              <div id="active-project-list" class="compact-list"><div class="loading">加载中...</div></div>
              <button id="btn-import-project" class="card-foot-link" type="button">＋ 导入项目</button>
            </section>

            <section class="dashboard-card compact-card" id="recent-conversations-card">
              <div class="dashboard-card-head">
                <h2>最近会话</h2>
                <button id="btn-view-all-history" class="section-link" type="button">查看全部<span aria-hidden="true">›</span></button>
              </div>
              <div id="recent-conversation-list" class="compact-list"><div class="loading">加载中...</div></div>
              <button id="btn-view-history" class="card-foot-link" type="button">查看全部历史记录<span aria-hidden="true">›</span></button>
            </section>

            <section class="dashboard-card compact-card suggestion-card">
              <div class="dashboard-card-head"><h2>建议操作</h2></div>
              <div class="suggestion-list">
                <button class="suggestion-item" type="button" data-home-action="run">
                  <span class="suggestion-icon is-amber"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/></svg></span>
                  <span><strong>运行测试套件</strong><small>检测并修复当前问题</small></span><span aria-hidden="true">›</span>
                </button>
                <button class="suggestion-item" type="button" data-home-action="security">
                  <span class="suggestion-icon is-blue"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9.5 12 1.6 1.6 3.7-4"/></svg></span>
                  <span><strong>安全扫描</strong><small>检查潜在安全风险</small></span><span aria-hidden="true">›</span>
                </button>
                <button class="suggestion-item" type="button" data-home-action="report">
                  <span class="suggestion-icon is-coral"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
                  <span><strong>性能分析</strong><small>分析应用性能瓶颈</small></span><span aria-hidden="true">›</span>
                </button>
              </div>
            </section>

            <section class="dashboard-card compact-card runtime-card">
              <div class="dashboard-card-head"><h2>模型与运行时</h2></div>
              <div class="runtime-list">
                <div><span>当前模型</span><button id="dashboard-model-button" type="button"><strong id="dashboard-model-name">未配置模型</strong><span aria-hidden="true">⌄</span></button></div>
                <div><span>上下文窗口</span><strong id="dashboard-context-size">—</strong></div>
                <div><span>工具集</span><span id="dashboard-toolset" class="runtime-tools">--</span></div>
                <div><span>运行时状态</span><strong class="runtime-state"><i></i><span id="dashboard-runtime-status">全部正常</span><span aria-hidden="true">›</span></strong></div>
              </div>
            </section>
          </div>
        </div>
      </section>

      <!-- 聊天详情 -->
      <section id="page-chat" class="page">
        <header class="chat-header">
          <button id="btn-back-home" class="icon-circle" type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="chat-header-main">
            <div id="header-title" class="chat-title">当前任务</div>
            <div id="current-project-path" class="chat-subtitle"></div>
          </div>
          <div class="chat-header-actions">
            <button id="btn-new-in-chat" class="icon-pill" type="button" aria-label="新消息">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1.1-4.2A8 8 0 1 1 21 12Z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
            </button>
            <button id="btn-chat-more" class="icon-pill" type="button" aria-label="更多">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            </button>
          </div>
        </header>

        <div id="message-list" class="chat-messages"></div>

        <div class="chat-input-area">
          <div class="chat-input-card">
            <textarea id="input-message" class="chat-input-box" placeholder="发消息，继续当前任务..." rows="1"></textarea>
            <div class="chat-input-toolbar">
              <div class="toolbar-left">
                <button id="btn-file-upload" class="tool-circle" type="button" aria-label="附件" title="附件">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </button>
                <button id="model-selector-btn" class="model-chip" type="button" title="切换模型">
                  <span class="model-chip-dot" aria-hidden="true"></span>
                  <span id="current-model-name">未配置模型</span>
                </button>
              </div>
              <div class="toolbar-right">
                <button id="btn-voice" class="tool-circle" type="button" aria-label="语音" title="语音">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v3"/></svg>
                </button>
                <button id="btn-interrupt" class="btn-interrupt hidden" type="button" aria-label="中断"></button>
                <button id="btn-send" class="send-btn" type="button" disabled aria-label="发送">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="model-panel" class="model-panel hidden">
          <div class="model-panel-header">选择模型</div>
          <div id="model-list" class="model-list"></div>
        </div>
      </section>

      <!-- 设置 -->
      <section id="page-settings" class="page">
        <header class="settings-header">
          <button id="btn-back-from-settings" class="icon-circle" type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2>连接与设置</h2>
        </header>
        <div class="settings-body">
          <div class="settings-section">
            <h3>连接信息</h3>
            <div class="setting-item">
              <span class="label">状态</span>
              <span id="setting-status" class="value">未连接</span>
            </div>
            <div class="setting-item">
              <span class="label">设备名</span>
              <span id="setting-device" class="value"></span>
            </div>
            <div class="setting-item">
              <span class="label">当前项目</span>
              <span id="setting-project" class="value">未选择</span>
            </div>
          </div>
          <div class="settings-section">
            <h3>技能</h3>
            <div id="skill-list" class="skill-list">
              <div class="loading">加载中...</div>
            </div>
          </div>
          <div class="settings-section">
            <button id="btn-disconnect" class="btn-danger" type="button">断开连接</button>
          </div>
        </div>
      </section>

      <nav class="mobile-tabbar" aria-label="主导航">
        <button class="mobile-tab active" type="button" data-mobile-page="home">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>首页</span>
        </button>
        <button class="mobile-tab" type="button" data-mobile-page="run">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 5 11 7-11 7V5Z"/></svg><span>运行</span>
        </button>
        <button class="mobile-tab" type="button" data-mobile-page="projects">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h7l2 2h9v10H3V7Z"/></svg><span>项目</span>
        </button>
        <button class="mobile-tab" type="button" data-mobile-page="files">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h5"/></svg><span>文件</span>
        </button>
        <button class="mobile-tab" type="button" data-mobile-page="settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>设置</span>
        </button>
      </nav>
    </div>

    <div id="mobile-toast" class="mobile-toast hidden" role="status" aria-live="polite"></div>

    <!-- 过程底部抽屉 -->
    <div id="process-sheet" class="process-sheet hidden" aria-hidden="true">
      <div class="process-sheet-backdrop" data-process-close></div>
      <section class="process-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="process-sheet-title">
        <div class="process-sheet-grip" aria-hidden="true"></div>
        <header class="process-sheet-header">
          <h3 id="process-sheet-title">过程</h3>
          <button id="process-sheet-close" class="process-sheet-close" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </header>
        <div id="process-sheet-content" class="process-sheet-content"></div>
      </section>
    </div>

    <!-- AI 询问 -->
    <div id="ask-overlay" class="ask-overlay hidden">
      <div class="ask-panel">
        <div class="ask-panel-header">
          <span class="ask-badge">询</span>
          <span>AI 需要你确认</span>
        </div>
        <div id="ask-question" class="ask-question"></div>
        <div id="ask-options" class="ask-options"></div>
        <div class="ask-input-row">
          <input id="ask-custom-input" type="text" placeholder="自定义回答..." class="ask-custom-input">
          <button id="ask-send-btn" class="btn-primary ask-send-btn" type="button">提交</button>
        </div>
      </div>
    </div>

    <!-- 隐藏兼容节点 -->
    <span id="ai-status-indicator" class="hidden"></span>
  </div>
  <script src="app.js"></script>
</body>
</html>
