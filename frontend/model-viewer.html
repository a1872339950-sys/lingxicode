<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="model.L6"></title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101114; color: #e5e7eb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #viewer { position: fixed; inset: 0; }
    .topbar { position: fixed; left: 14px; top: 12px; right: 14px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
    .meta { min-width: 0; padding: 8px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: rgba(20,22,28,0.72); backdrop-filter: blur(12px); box-shadow: 0 10px 28px rgba(0,0,0,0.28); }
    .name { max-width: 54vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .path { max-width: 54vw; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: rgba(229,231,235,0.58); }
    .hint { padding: 7px 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; background: rgba(20,22,28,0.6); color: rgba(229,231,235,0.72); font-size: 11px; white-space: nowrap; backdrop-filter: blur(12px); }
    .state { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; color: rgba(229,231,235,0.7); font-size: 13px; pointer-events: none; }
    .state.error { color: #f87171; padding: 24px; text-align: center; line-height: 1.6; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div class="topbar">
    <div class="meta">
      <div class="name" id="modelName" data-i18n="model.L24"></div>
      <div class="path" id="modelPath"></div>
    </div>
    <div class="hint" data-i18n="sub.27">左键旋转 · 滚轮缩放 · 右键平移</div>
  </div>
  <div class="state" id="state" data-i18n="sub.29">正在加载模型...</div>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

    const params = new URLSearchParams(location.search)
    const modelPath = params.get('path') || ''
    const modelName = modelPath.split(/[\\/]/).pop() || '3D 模型'
    const container = document.getElementById('viewer')
    const state = document.getElementById('state')
    document.getElementById('modelName').textContent = modelName
    document.getElementById('modelPath').textContent = modelPath

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x101114)

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 10000)
    camera.position.set(3, 2.2, 4)

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.outputColorSpace = THREE.SRGBColorSpace
    container.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.dampingFactor = 0.08

    scene.add(new THREE.HemisphereLight(0xffffff, 0x1f2937, 2.2))
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4)
    keyLight.position.set(4, 6, 5)
    scene.add(keyLight)
    const fillLight = new THREE.DirectionalLight(0x9ec5ff, 0.9)
    fillLight.position.set(-5, 2, -4)
    scene.add(fillLight)

    const grid = new THREE.GridHelper(10, 20, 0x3f4654, 0x252a33)
    grid.position.y = -0.01
    scene.add(grid)

    function toFileUrl(filePath) {
      let normalized = String(filePath || '').replace(/\\/g, '/')
      if (!normalized.startsWith('/')) normalized = '/' + normalized
      return 'file://' + encodeURI(normalized)
    }

    function fitCamera(object) {
      const box = new THREE.Box3().setFromObject(object)
      const size = box.getSize(new THREE.Vector3())
      const center = box.getCenter(new THREE.Vector3())
      const maxDim = Math.max(size.x, size.y, size.z, 1)
      const distance = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360))
      camera.position.set(center.x + distance * 0.9, center.y + distance * 0.55, center.z + distance * 1.15)
      camera.near = Math.max(maxDim / 1000, 0.01)
      camera.far = Math.max(maxDim * 100, 1000)
      camera.updateProjectionMatrix()
      controls.target.copy(center)
      controls.update()
      grid.scale.setScalar(Math.max(1, maxDim / 2))
      grid.position.y = box.min.y
    }

    function setError(message) {
      state.className = 'state error'
      state.textContent = message
    }

    if (!modelPath) {
      setError('没有收到模型路径。')
    } else {
      const loader = new GLTFLoader()
      loader.load(
        toFileUrl(modelPath),
        gltf => {
          const root = gltf.scene || gltf.scenes?.[0]
          if (!root) {
            setError('模型文件已加载，但没有可显示的场景内容。')
            return
          }
          scene.add(root)
          fitCamera(root)
          state.style.display = 'none'
        },
        undefined,
        error => {
          console.error(error)
          setError('模型加载失败：' + (error?.message || '请确认文件是有效的 .glb/.gltf'))
        }
      )
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    function animate() {
      requestAnimationFrame(animate)
      controls.update()
      renderer.render(scene, camera)
    }
    animate()
  </script>

  <script type="module">
    import { i18n } from './scripts/core/i18n.js'
    await i18n.init()
    i18n.applyI18n(document)
  </script>
</body>
</html>
